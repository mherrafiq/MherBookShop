[build]
  base = "client"
  publish = "build"
  command = "npm run build"

[build.environment]
  CI = "false"

[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

[functions."*"]
  external_node_modules = ["mysql2"]

# Route all /api/* requests directly to our full Express app
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
