[build]
  base = "client"
  publish = "build"
  command = "npm run build"

[build.environment]
  CI = "false"

[functions]
  directory = "../netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Upload API route
[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200
  force = true

# Books API routes
[[redirects]]
  from = "/api/books/*"
  to = "/.netlify/functions/books"
  status = 200
  force = true

[[redirects]]
  from = "/api/books"
  to = "/.netlify/functions/books"
  status = 200
  force = true

# Cart API routes
[[redirects]]
  from = "/api/cart/*"
  to = "/.netlify/functions/cart"
  status = 200
  force = true

[[redirects]]
  from = "/api/cart"
  to = "/.netlify/functions/cart"
  status = 200
  force = true

# Auth routes
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200
  force = true

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
