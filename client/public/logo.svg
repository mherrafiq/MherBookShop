<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" /> <!-- Deep purple -->
      <stop offset="100%" stop-color="#8B5CF6" /> <!-- Light purple -->
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" /> <!-- Amber -->
      <stop offset="100%" stop-color="#FCD34D" /> <!-- Yellow -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Page Stack -->
  <path d="M100 160 C 60 160, 30 140, 30 140 L 30 60 C 30 60, 60 80, 100 80 Z" fill="url(#primary-grad)" />
  <path d="M96 150 C 64 150, 40 134, 40 134 L 40 70 C 40 70, 64 86, 96 86 Z" fill="#ffffff" opacity="0.15" />
  <path d="M92 140 C 68 140, 50 128, 50 128 L 50 80 C 50 80, 68 92, 92 92 Z" fill="#ffffff" opacity="0.3" />

  <!-- Right Page Stack -->
  <path d="M100 160 C 140 160, 170 140, 170 140 L 170 60 C 170 60, 140 80, 100 80 Z" fill="url(#primary-grad)" opacity="0.8" />
  <path d="M104 150 C 136 150, 160 134, 160 134 L 160 70 C 160 70, 136 86, 104 86 Z" fill="#ffffff" opacity="0.1" />
  <path d="M108 140 C 132 140, 150 128, 150 128 L 150 80 C 150 80, 132 92, 108 92 Z" fill="#ffffff" opacity="0.25" />

  <!-- Spine / Center Line -->
  <path d="M100 78 L 100 162" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

  <!-- Floating Bookmark/Star -->
  <path d="M 100 35 L 105 55 L 125 60 L 105 65 L 100 85 L 95 65 L 75 60 L 95 55 Z" fill="url(#accent-grad)" filter="url(#glow)" />
  
  <!-- Mini sparks -->
  <circle cx="145" cy="45" r="4" fill="#FCD34D" filter="url(#glow)"/>
  <circle cx="60" cy="40" r="3" fill="#C4B5FD" />
</svg>
